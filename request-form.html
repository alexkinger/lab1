<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Session | Peer Tutoring Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Peer Tutoring Hub</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="tutors.html">Tutors</a>
                <a class="nav-link active" href="request-form.html">Request a Session</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="mb-3">Request a Tutoring Session</h1>
        <p>Tell us the course and your preferred date. We will match you with an available peer tutor.</p>

        <div class="row">
            <div class="col-md-8 col-lg-6">
                <form action="process-request.php" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="course">Course</label>
                        <input class="form-control" id="course" name="course" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="date">Preferred Date</label>
                        <input class="form-control" id="date" name="date" type="date" required>
                    </div>

                    <button class="btn btn-primary" type="submit">Request Session</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
